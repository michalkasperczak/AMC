name = amcController
summary = "AMC — sterowanie odtwarzaczem"
description = """Sterowanie AMC przez Ctrl+Windows: odtwarzanie, presety, zakładki, nagrywanie i jawne otwieranie list. W samym AMC dodatkowo Insert+Strzałka w górę czyta stację i utwór, który teraz leci. Wymaga AMC alpha 385 lub nowszego. Skróty można zmienić w NVDA: Ustawienia > Zdarzenia wejścia > AMC. Prefiks AMC pozostaje niezależny. Free Radio powinno być wyłączone lub mieć inne skróty."""
author = "Projekt AMC"
url = https://github.com/michalkasperczak/AMC
version = 0.3.0
