name = amcController
summary = "AMC — sterowanie odtwarzaczem"
description = """Sterowanie AMC Test i AMC Public przez Ctrl+Windows: odtwarzanie, presety, zakładki, nagrywanie i jawne otwieranie list. Dodatek wybiera aktywne okno AMC albo ostatnio używany profil i wymaga aktualnych wersji obu profili z oddzielnymi połączeniami. Pomaga NVDA odnaleźć pasek stanu AMC; nie przejmuje standardowych poleceń czytnika. Skróty można zmienić w NVDA: Ustawienia > Zdarzenia wejścia > AMC. Prefiks AMC pozostaje niezależny. Free Radio powinno być wyłączone lub mieć inne skróty."""
author = "Projekt AMC"
url = https://github.com/michalkasperczak/AMC
version = 0.4.2
minimumNVDAVersion = 2026.1.0
