name = amcController
summary = "AMC — sterowanie odtwarzaczem"
description = """Sterowanie AMC przez Ctrl+Windows: odtwarzanie, presety, zakładki, nagrywanie i jawne otwieranie list. W samym AMC dodatkowo NVDA+Strzałka w górę czyta, co teraz leci — w Radiu internetowym tak samo jak w sesji WiiM: stacja, utwór, wykonawca i album. Poza AMC ten skrót działa normalnie jak w NVDA. Wymaga AMC alpha 386 lub nowszego. Skróty można zmienić w NVDA: Ustawienia > Zdarzenia wejścia > AMC. Prefiks AMC pozostaje niezależny. Free Radio powinno być wyłączone lub mieć inne skróty."""
author = "Projekt AMC"
url = https://github.com/michalkasperczak/AMC
version = 0.3.2
minimumNVDAVersion = 2026.1.0
# Michal ma NVDA 2026.2 na OBU maszynach.  Gdy lastTestedNVDAVersion jest
