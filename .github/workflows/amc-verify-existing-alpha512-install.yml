name: AMC — jednorazowy smoke instalacji alpha.512

on:
  push:
    branches:
      - codex/amc-verify-install-alpha512

permissions:
  actions: read
  contents: read

jobs:
  smoke-existing-installers:
    if: >-
      github.run_attempt == '1' &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.ref == 'refs/heads/codex/amc-verify-install-alpha512'
    runs-on: windows-2025
    timeout-minutes: 55

    steps:
      - name: Pobierz wyłącznie kod weryfikatora bez poświadczeń
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Pobierz przypięte artefakty tylko przez token kroku
        shell: pwsh
        env:
          AMC_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $sourceRevision = 'd360cd89f622b90ae351f1ed876904b38856b625'
          $sourceRef = 'refs/heads/codex/amc-protected-public-test-20261119-playback-r1'
          $sourceBranch = 'codex/amc-protected-public-test-20261119-playback-r1'
          $runId = 45016390370
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'amc-alpha512-install-artifacts'
          if (Test-Path -LiteralPath $artifactRoot) { throw 'Katalog pobranych artefaktów istnieje przed rozpoczęciem.' }
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null
          $headers = @{ Authorization = "Bearer $env:AMC_ARTIFACT_TOKEN"; Accept = 'application/vnd.github+json' }
          try {
            $run = Invoke-RestMethod -Uri "https://api.github.com/repos/michalkasperczak/AMC/actions/runs/$runId" -Headers $headers -ErrorAction Stop
            if ($run.id -ne $runId -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.run_attempt -ne 1 -or $run.head_sha -cne $sourceRevision -or $run.head_branch -cne $sourceBranch) { throw 'Metadane zamrożonego runu nie są dokładnie zgodne z kontraktem.' }
            [ordered]@{ id = $run.id; status = $run.status; conclusion = $run.conclusion; runAttempt = $run.run_attempt; sourceRevision = $run.head_sha; sourceRef = $sourceRef } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactRoot 'source-run.json') -Encoding utf8
            foreach ($artifact in @(
              [ordered]@{ id = 14752053921; name = 'amc-protected-public-test-installers-d360cd89f622b90ae351f1ed876904b38856b625'; bytes = 347655437; digest = 'sha256:f56a2b11c650f890bfe39571f99257ead3934fe25c0ebf29080dc1d8928a6f71'; destination = 'installers.zip' },
              [ordered]@{ id = 14752572396; name = 'amc-protected-public-test-evidence-d360cd89f622b90ae351f1ed876904b38856b625'; bytes = 6000; digest = 'sha256:c438451b243408bdcad4e871545de24d158f3381449e5538ed52959c4aa34175'; destination = 'evidence.zip' }
            )) {
              $metadata = Invoke-RestMethod -Uri "https://api.github.com/repos/michalkasperczak/AMC/actions/artifacts/$($artifact.id)" -Headers $headers -ErrorAction Stop
              if ($metadata.id -ne $artifact.id -or $metadata.name -cne $artifact.name -or $metadata.size_in_bytes -ne $artifact.bytes -or $metadata.digest -cne $artifact.digest -or $metadata.expired -or $metadata.workflow_run.id -ne $runId -or $metadata.workflow_run.head_sha -cne $sourceRevision -or $metadata.workflow_run.head_branch -cne $sourceBranch) { throw 'Metadane przypiętego artefaktu nie są dokładnie zgodne z kontraktem.' }
              Invoke-WebRequest -Uri "https://api.github.com/repos/michalkasperczak/AMC/actions/artifacts/$($artifact.id)/zip" -Headers $headers -OutFile (Join-Path $artifactRoot $artifact.destination) -ErrorAction Stop
            }
          }
          finally {
            $headers.Clear()
            $env:AMC_ARTIFACT_TOKEN = $null
            Remove-Item Env:\AMC_ARTIFACT_TOKEN -ErrorAction SilentlyContinue
          }

      - name: Włącz ochronę i wykonaj smoke istniejących instalatorów
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $sourceRevision = 'd360cd89f622b90ae351f1ed876904b38856b625'
          $sourceRef = 'refs/heads/codex/amc-protected-public-test-20261119-playback-r1'
          $version = '0.1.0-alpha.512'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'amc-alpha512-install-artifacts'
          $evidence = Join-Path $env:RUNNER_TEMP 'amc-alpha512-install-evidence'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'amc-alpha512-install-smoke'
          $verified = Join-Path $smokeRoot 'verified'
          $jobStarted = [DateTime]::UtcNow
          $script:finalAudit = $null
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $report = [ordered]@{
            schemaVersion = 1
            sourceRevision = $sourceRevision
            sourceRef = $sourceRef
            version = $version
            sourceRun = $null
            startedUtc = $jobStarted.ToString('o')
            finishedUtc = $null
            protection = [ordered]@{ before = $null; after = $null; exitCode = 1; error = $null }
            gates = @()
            verifiedInputs = $null
            installations = [ordered]@{}
            error = $null
          }

          function Get-DefenderEvents {
            try {
              return @(Get-WinEvent -FilterHashtable @{
                LogName = 'Microsoft-Windows-Windows Defender/Operational'
                Id = 1116,1117
                StartTime = $jobStarted
              } -ErrorAction Stop | ForEach-Object {
                [ordered]@{ timeUtc = $_.TimeCreated.ToUniversalTime().ToString('o'); id = $_.Id; message = $_.Message }
              })
            }
            catch {
              if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') {
                return @()
              }
              throw
            }
          }

          function Get-DefenderSnapshot {
            $warnings = @()
            $status = Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings
            $preference = Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings
            if ($warnings.Count -gt 0) { throw 'Odczyt stanu Defendera zwrócił ostrzeżenia.' }
            return [ordered]@{
              status = [ordered]@{
                antivirusEnabled = $status.AntivirusEnabled
                realTimeProtectionEnabled = $status.RealTimeProtectionEnabled
                behaviorMonitorEnabled = $status.BehaviorMonitorEnabled
                ioavProtectionEnabled = $status.IoavProtectionEnabled
                onAccessProtectionEnabled = $status.OnAccessProtectionEnabled
                mode = $status.AMRunningMode
                engine = $status.AMEngineVersion
                signature = $status.AntivirusSignatureVersion
                signatureUpdatedUtc = if ($null -eq $status.AntivirusSignatureLastUpdated) { $null } else { $status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o') }
              }
              preference = [ordered]@{
                disableRealtimeMonitoring = $preference.DisableRealtimeMonitoring
                disableBehaviorMonitoring = $preference.DisableBehaviorMonitoring
                disableIOAVProtection = $preference.DisableIOAVProtection
                disableArchiveScanning = $preference.DisableArchiveScanning
                disableScriptScanning = $preference.DisableScriptScanning
                exclusionPathCount = @($preference.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count
                exclusionProcessCount = @($preference.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count
                exclusionExtensionCount = @($preference.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count
              }
            }
          }

          function Assert-DefenderSnapshot {
            param([Parameter(Mandatory)]$Snapshot)
            $status = $Snapshot.status
            $preference = $Snapshot.preference
            if (-not $status.antivirusEnabled -or -not $status.realTimeProtectionEnabled -or -not $status.behaviorMonitorEnabled -or -not $status.ioavProtectionEnabled -or -not $status.onAccessProtectionEnabled -or $status.mode -ne 'Normal') {
              throw 'Defender nie jest aktywny w wymaganym trybie ochrony rzeczywistej.'
            }
            if ($preference.disableRealtimeMonitoring -or $preference.disableBehaviorMonitoring -or $preference.disableIOAVProtection -or $preference.disableArchiveScanning -or $preference.disableScriptScanning) {
              throw 'Defender ma wyłączony wymagany składnik ochrony.'
            }
            if ($preference.exclusionPathCount -ne 0 -or $preference.exclusionProcessCount -ne 0 -or $preference.exclusionExtensionCount -ne 0) {
              throw 'Defender ma wykluczenia; smoke kończy się fail-closed.'
            }
          }

          function Invoke-DefenderGate {
            param([Parameter(Mandatory)][string]$Target, [Parameter(Mandatory)][string]$Stage)
            $entry = [ordered]@{ stage = $Stage; target = $Target; startedUtc = [DateTime]::UtcNow.ToString('o'); finishedUtc = $null; exitCode = 1; snapshot = $null; threats = @(); detections = @(); events1116_1117 = @(); error = $null }
            try {
              $entry.snapshot = Get-DefenderSnapshot
              Assert-DefenderSnapshot -Snapshot $entry.snapshot
              $warnings = @()
              $entry.threats = @(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings)
              $entry.detections = @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings)
              if ($warnings.Count -gt 0 -or $entry.threats.Count -gt 0 -or $entry.detections.Count -gt 0) { throw 'Defender zgłasza bieżące zagrożenie, wykrycie albo ostrzeżenie.' }
              Start-MpScan -ScanType CustomScan -ScanPath $Target -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings
              $entry.threats = @(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings)
              $entry.detections = @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +warnings)
              $entry.events1116_1117 = @(Get-DefenderEvents)
              if ($warnings.Count -gt 0 -or $entry.threats.Count -gt 0 -or $entry.detections.Count -gt 0 -or $entry.events1116_1117.Count -gt 0) { throw 'Skan Defendera zwrócił ostrzeżenie, zagrożenie, wykrycie albo zdarzenie 1116/1117.' }
              $entry.exitCode = 0
            }
            catch {
              $entry.error = $_.Exception.Message
              throw
            }
            finally {
              $entry.finishedUtc = [DateTime]::UtcNow.ToString('o')
              $script:report.gates += $entry
              if ($Stage -ceq 'final-defender-audit') { $script:finalAudit = $entry }
            }
          }

          function Clear-DownloadCredentials {
            foreach ($secret in @('AMC_ARTIFACT_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN')) {
              Remove-Item "Env:$secret" -ErrorAction SilentlyContinue
            }
          }

          function Invoke-InstallerSmoke {
            param(
              [Parameter(Mandatory)][string]$Profile,
              [Parameter(Mandatory)][string]$Installer,
              [Parameter(Mandatory)][string]$InstallDirectory,
              [Parameter(Mandatory)]$Contract
            )
            Clear-DownloadCredentials
            if (Test-Path -LiteralPath $InstallDirectory) { throw "Katalog instalacji $Profile musi być czysty." }
            New-Item -ItemType Directory -Path (Split-Path -Parent $InstallDirectory) -Force | Out-Null
            Invoke-DefenderGate -Target $Installer -Stage "$Profile-installer-before-execution"
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $Installer
            $start.UseShellExecute = $false
            foreach ($argument in @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$InstallDirectory")) { [void]$start.ArgumentList.Add($argument) }
            foreach ($secret in @('GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN')) { [void]$start.Environment.Remove($secret) }
            $process = [Diagnostics.Process]::Start($start)
            try {
              if (-not $process.WaitForExit(600000)) {
                $process.Kill($true)
                throw "Instalator $Profile przekroczył limit 600 sekund."
              }
              if ($process.ExitCode -ne 0) { throw "Instalator $Profile zakończył się kodem $($process.ExitCode)." }
            }
            finally { $process.Dispose() }
            $launcher = Join-Path $InstallDirectory 'AMC.exe'
            $manifestPath = Join-Path $InstallDirectory 'bundle-manifest.json'
            if (-not (Test-Path -LiteralPath $launcher -PathType Leaf) -or -not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw "Instalacja $Profile nie dostarczyła launchera i manifestu." }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            foreach ($expected in @(
              @{ name = 'releaseProfile'; value = $Profile },
              @{ name = 'productId'; value = [string]$Contract.productId },
              @{ name = 'installId'; value = [string]$Contract.installId },
              @{ name = 'updateChannel'; value = [string]$Contract.updateChannel },
              @{ name = 'sourceRevision'; value = $sourceRevision },
              @{ name = 'displayVersion'; value = [string]$Contract.displayVersion }
            )) {
              if ([string]$manifest.($expected.name) -ne $expected.value) { throw "Manifest $Profile ma nieprawidłowe pole $($expected.name)." }
            }
            $launcherVersion = ([string](Get-Item -LiteralPath $launcher).VersionInfo.ProductVersion -split '\+', 2)[0]
            if ($launcherVersion -ne $version) { throw "Launcher $Profile ma wersję $launcherVersion zamiast $version." }
            $sessions = @($manifest.sessions)
            $playwrightMarker = Join-Path $InstallDirectory 'runtime\Lib\site-packages\playwright\__init__.py'
            if ($Profile -eq 'public' -and $sessions -contains 'appleMusic') { throw 'AMC Public nie może zawierać Apple Music.' }
            if ($Profile -eq 'public' -and (Test-Path -LiteralPath $playwrightMarker -PathType Leaf)) { throw 'AMC Public nie może fizycznie zawierać markera Playwright Apple Music.' }
            if ($Profile -eq 'test' -and $sessions -notcontains 'appleMusic') { throw 'AMC Test nie ma oczekiwanego Apple Music.' }
            if ($Profile -eq 'test' -and -not (Test-Path -LiteralPath $playwrightMarker -PathType Leaf)) { throw 'AMC Test nie ma fizycznego markera Playwright Apple Music.' }
            $appPathLeaf = if ($Profile -eq 'public') { 'AMC.exe' } else { 'AMC-Test.exe' }
            $registryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\$appPathLeaf"
            if (-not (Test-Path -LiteralPath $registryPath)) { throw "Brak wpisu App Paths dla $Profile." }
            $registered = [string](Get-ItemProperty -LiteralPath $registryPath).'(default)'
            if ($registered -ne $launcher) { throw "Wpis App Paths $Profile nie wskazuje rzeczywistego launchera." }
            $script:report.installations[$Profile] = [ordered]@{
              installer = $Contract.installer
              installerBytes = $Contract.bytes
              installerSha256 = $Contract.sha256
              installDirectory = $InstallDirectory
              launcher = $launcher
              launcherVersion = $launcherVersion
              manifest = [ordered]@{ releaseProfile = $manifest.releaseProfile; productId = $manifest.productId; installId = $manifest.installId; updateChannel = $manifest.updateChannel; sourceRevision = $manifest.sourceRevision; displayVersion = $manifest.displayVersion; sessions = $sessions }
              appPaths = [ordered]@{ key = $registryPath; value = $registered }
            }
          }

          try {
            if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REF -cne 'refs/heads/codex/amc-verify-install-alpha512') { throw 'Niedozwolone środowisko lub ref dla jednorazowego smoke.' }
            $before = Get-DefenderSnapshot
            $report.protection.before = $before
            $setupWarnings = @()
            $preferences = Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +setupWarnings
            if ($setupWarnings.Count -gt 0) { throw 'Odczyt preferencji Defendera zwrócił ostrzeżenia.' }
            foreach ($path in @($preferences.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })) { Remove-MpPreference -ExclusionPath $path -ErrorAction Stop -WarningAction Continue -WarningVariable +setupWarnings }
            foreach ($processName in @($preferences.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })) { Remove-MpPreference -ExclusionProcess $processName -ErrorAction Stop -WarningAction Continue -WarningVariable +setupWarnings }
            foreach ($extension in @($preferences.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })) { Remove-MpPreference -ExclusionExtension $extension -ErrorAction Stop -WarningAction Continue -WarningVariable +setupWarnings }
            Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -DisableArchiveScanning $false -DisableScriptScanning $false -ErrorAction Stop -WarningAction Continue -WarningVariable +setupWarnings
            Update-MpSignature -ErrorAction Stop -WarningAction Continue -WarningVariable +setupWarnings
            if ($setupWarnings.Count -gt 0) { throw 'Włączenie lub aktualizacja Defendera zwróciły ostrzeżenia.' }
            $after = Get-DefenderSnapshot
            Assert-DefenderSnapshot -Snapshot $after
            $report.protection = [ordered]@{ before = $before; after = $after; exitCode = 0 }
            $report.protection | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'protection-setup.json') -Encoding utf8

            Invoke-DefenderGate -Target $env:GITHUB_WORKSPACE -Stage 'workflow-source-before-artifact-use'
            if (Test-Path -LiteralPath $smokeRoot) { throw 'Katalog smoke istnieje przed rozpoczęciem.' }
            if (-not (Test-Path -LiteralPath (Join-Path $artifactRoot 'source-run.json') -PathType Leaf)) { throw 'Brak zweryfikowanych metadanych zamrożonego runu.' }
            $binaryZip = Join-Path $artifactRoot 'installers.zip'
            $evidenceZip = Join-Path $artifactRoot 'evidence.zip'
            if (-not (Test-Path -LiteralPath $binaryZip -PathType Leaf) -or -not (Test-Path -LiteralPath $evidenceZip -PathType Leaf)) { throw 'Brak obu przypiętych archiwów artefaktów.' }
            $report.sourceRun = Get-Content -LiteralPath (Join-Path $artifactRoot 'source-run.json') -Raw | ConvertFrom-Json
            New-Item -ItemType Directory -Path $smokeRoot | Out-Null
            Invoke-DefenderGate -Target $binaryZip -Stage 'binary-artifact-before-safe-extraction'
            Invoke-DefenderGate -Target $evidenceZip -Stage 'evidence-artifact-before-safe-extraction'
            Clear-DownloadCredentials
            python tools/verify_existing_alpha512_artifacts.py --binary-zip $binaryZip --evidence-zip $evidenceZip --output-directory $verified --report (Join-Path $evidence 'verified-inputs.json')
            if ($LASTEXITCODE -ne 0) { throw "Weryfikator artefaktów zakończył się kodem $LASTEXITCODE." }
            $report.verifiedInputs = Get-Content -LiteralPath (Join-Path $evidence 'verified-inputs.json') -Raw | ConvertFrom-Json
            Invoke-DefenderGate -Target $verified -Stage 'verified-inputs-before-install'
            $nvdaAddons = Join-Path $env:APPDATA 'nvda\addons'
            if (Test-Path -LiteralPath $nvdaAddons) { throw 'Fresh runner ma już nvda/addons; smoke odmawia próby instalacji.' }
            Invoke-InstallerSmoke -Profile 'public' -Installer (Join-Path $verified 'public\AMC-Public-2026-11-22-1129.exe') -InstallDirectory (Join-Path $smokeRoot 'install-public') -Contract $report.verifiedInputs.profiles.public
            Invoke-InstallerSmoke -Profile 'test' -Installer (Join-Path $verified 'test\AMC-Test-2026-11-22-1137.exe') -InstallDirectory (Join-Path $smokeRoot 'install-test') -Contract $report.verifiedInputs.profiles.test
            foreach ($profile in @('public', 'test')) {
              $appPath = $report.installations[$profile].appPaths
              $registered = [string](Get-ItemProperty -LiteralPath $appPath.key).'(default)'
              if ($registered -ne $appPath.value) { throw "Wpis App Paths $profile zmienił się po drugiej instalacji." }
              $appPath['afterBothInstallations'] = $registered
            }
            Invoke-DefenderGate -Target $smokeRoot -Stage 'final-defender-audit'
          }
          catch {
            $report.error = $_.Exception.Message
            $report.protection.error = $_.Exception.Message
            throw
          }
          finally {
            $report.finishedUtc = [DateTime]::UtcNow.ToString('o')
            $audit = $script:finalAudit
            if ($null -eq $audit) {
              $audit = [ordered]@{ stage = 'final-defender-audit'; target = $smokeRoot; startedUtc = $null; finishedUtc = $null; exitCode = 1; snapshot = $null; threats = @(); detections = @(); events1116_1117 = @(); error = $report.error }
            }
            try {
              $report.protection | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'protection-setup.json') -Encoding utf8
              $report | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $evidence 'smoke.json') -Encoding utf8
              $audit | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidence 'final-defender-audit.json') -Encoding utf8
            }
            catch {
              if ([string]::IsNullOrWhiteSpace($report.error)) { throw }
            }
          }

      - name: Zachowaj wyłącznie małe raporty smoke
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amc-alpha512-install-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/amc-alpha512-install-evidence/
          if-no-files-found: error
          retention-days: 30
