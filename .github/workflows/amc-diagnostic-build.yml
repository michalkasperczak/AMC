name: AMC — jednorazowa kontrolowana budowa diagnostyczna

on:
  push:
    branches:
      - codex/amc-diagnostic-gh-protected-20261118
    paths:
      - .github/workflows/amc-diagnostic-build.yml
      - wxlite/tools/Build-AMCBundle.ps1
      - wxlite/tools/Build-AMCInstaller.ps1
      - wxlite/tools/build_bundle.py
      - wxlite/**
      - src/**
      - installer/**
      - nvda-addon/**
      - Directory.Build.props

permissions:
  contents: read

jobs:
  diagnose:
    # Tylko pierwsze utworzenie dokładnie tej gałęzi może uruchomić job.
    # Późniejszy push ani ponowne uruchomienie nie są drogą obejścia bramek.
    if: >-
      github.run_attempt == '1' &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.ref == 'refs/heads/codex/amc-diagnostic-gh-protected-20261118'
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Pobierz dokładne źródła bez poświadczeń
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Utwórz izolowany katalog dowodów
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          $evidence = Join-Path $env:RUNNER_TEMP 'amc-diagnostic-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $jobStarted = [DateTime]::UtcNow
          $source = [ordered]@{
            capturedUtc = $jobStarted.ToString('o')
            sourceSha = (git rev-parse HEAD).Trim()
            sourceStatus = @(& git status --porcelain=v1 --untracked-files=no)
            runner = $env:RUNNER_NAME
            ref = $env:GITHUB_REF
            sha = $env:GITHUB_SHA
          }
          $source | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'source.json') -Encoding utf8
          "AMC_DIAGNOSTIC_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AMC_DIAGNOSTIC_JOB_STARTED=$($jobStarted.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Włącz ochronę wyłącznie na zatwierdzonej tymczasowej VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\wxlite\tools\Enable-AMCDiagnosticProtection.ps1 -EvidenceDirectory $env:AMC_DIAGNOSTIC_EVIDENCE

      - name: Defender source preflight — fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          $stage = 'defender-source-preflight'
          $reportPath = Join-Path $env:AMC_DIAGNOSTIC_EVIDENCE "$stage.json"
          $report = [ordered]@{ stage=$stage; startedUtc=[DateTime]::UtcNow.ToString('o'); finishedUtc=$null; exitCode=1; sourceSha=(git rev-parse HEAD).Trim(); status=$null; preference=$null; threats=@(); events1116_1117=@(); error=$null }
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings
            $preference = Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings
            $report.status = [ordered]@{ antivirusEnabled=$status.AntivirusEnabled; realTimeProtectionEnabled=$status.RealTimeProtectionEnabled; amRunningMode=$status.AMRunningMode; amProductVersion=$status.AMProductVersion; amEngineVersion=$status.AMEngineVersion; antivirusSignatureVersion=$status.AntivirusSignatureVersion; antivirusSignatureLastUpdated=$status.AntivirusSignatureLastUpdated }
            $report.preference = [ordered]@{ disableRealtimeMonitoring=$preference.DisableRealtimeMonitoring; disableBehaviorMonitoring=$preference.DisableBehaviorMonitoring; disableIOAVProtection=$preference.DisableIOAVProtection; exclusionPathCount=@($preference.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count; exclusionProcessCount=@($preference.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count; exclusionExtensionCount=@($preference.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count }
            if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal' -or $preference.DisableRealtimeMonitoring -or $preference.DisableBehaviorMonitoring -or $preference.DisableIOAVProtection) { throw 'Defender nie jest aktywny w wymaganym trybie ochrony rzeczywistej.' }
            if ([string]::IsNullOrWhiteSpace([string]$status.AMEngineVersion) -or [string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $null -eq $status.AntivirusSignatureLastUpdated -or ([DateTime]::UtcNow - [DateTime]$status.AntivirusSignatureLastUpdated.ToUniversalTime()).TotalDays -gt 7) { throw 'Silnik lub sygnatury Defendera są nieobecne albo nieświeże.' }
            if (@($preference.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($preference.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($preference.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw 'Wykluczenia Defendera uniemożliwiają faktyczne potwierdzenie ochrony celów diagnostyki.' }
            $report.threats = @(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings | ForEach-Object { [ordered]@{ threatId=$_.ThreatID; name=$_.ThreatName; severity=$_.Severity } })
            $detections = @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings)
            if ($report.threats.Count -gt 0 -or $detections.Count -gt 0) { throw 'Defender zgłasza istniejące zagrożenie lub wykrycie.' }
            Start-MpScan -ScanType CustomScan -ScanPath $env:GITHUB_WORKSPACE -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings
            try { $events = @(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop | ForEach-Object { [ordered]@{ timeUtc=$_.TimeCreated.ToUniversalTime().ToString('o'); id=$_.Id; message=$_.Message } }) } catch { if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') { $events=@() } else { throw } }
            $report.events1116_1117 = $events
            if ($events.Count -gt 0) { throw 'Defender zgłosił wykrycie lub działanie ochronne od początku jobu.' }
            if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }
            $report.exitCode = 0
          } catch { $report.error=$_.Exception.Message; throw } finally { $report.finishedUtc=[DateTime]::UtcNow.ToString('o'); $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $reportPath -Encoding utf8 }

      - name: Ustaw przypięty SDK zgodny z global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.423

      - name: Pobierz zamknięte wejścia i rozpakuj tylko runtime na VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          function Invoke-DefenderGate { param([string]$Target,[string]$Stage)
            $diagWarnings=@()
            $status=Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; $pref=Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings
            if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal' -or [string]::IsNullOrWhiteSpace([string]$status.AMEngineVersion) -or [string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $null -eq $status.AntivirusSignatureLastUpdated -or ([DateTime]::UtcNow - [DateTime]$status.AntivirusSignatureLastUpdated.ToUniversalTime()).TotalDays -gt 7 -or $pref.DisableRealtimeMonitoring -or $pref.DisableBehaviorMonitoring -or $pref.DisableIOAVProtection -or @($pref.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw "Defender preflight failed: $Stage" }
            if (@(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0 -or @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0) { throw "Defender threat state failed: $Stage" }
            Start-MpScan -ScanType CustomScan -ScanPath $Target -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }
            try { $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop) } catch { if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') { $events=@() } else { throw } }
            if ($events.Count -gt 0) { throw "Defender events 1116/1117: $Stage" }
          }
          $stage='closed-inputs'; $reportPath=Join-Path $env:AMC_DIAGNOSTIC_EVIDENCE "$stage.json"; $report=[ordered]@{stage=$stage; startedUtc=[DateTime]::UtcNow.ToString('o'); finishedUtc=$null; exitCode=1; priorInstaller=$null; innoextract=$null; runtime=$null; error=$null}
          try {
            $prior=Join-Path $env:RUNNER_TEMP 'amc-prior'; New-Item -ItemType Directory -Path $prior -Force | Out-Null
            $installer=Join-Path $prior 'AMC-Test-2026-11-15-2036.exe'; Invoke-WebRequest -Uri 'https://github.com/michalkasperczak/AMC/releases/download/test-2026.11.15.2036/AMC-Test-2026-11-15-2036.exe' -OutFile $installer -ErrorAction Stop
            $installerHash=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant(); if ($installerHash -cne '078ce7cddb4461552071192f7d83bc4623d02bac0d2b55e587d5fde41d7f8591' -or (Get-Item -LiteralPath $installer).Length -ne 218531931) { throw 'Nieprawidłowy hash lub rozmiar hash-verified AMC Test input.' }
            Invoke-DefenderGate -Target $installer -Stage 'prior-installer-before-extraction'
            $archive=Join-Path $prior 'innoextract670.zip'; Invoke-WebRequest -Uri 'https://github.com/UserUnknownFactor/innoextract_win/releases/download/670/innoextract670.zip' -OutFile $archive -ErrorAction Stop
            $archiveHash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant(); if ($archiveHash -cne '79b69b9b1fcd98f42ccd4b245efdf6a03bcfb674ba6af482f5a46891c9ed4d14' -or (Get-Item -LiteralPath $archive).Length -ne 928736) { throw 'Nieprawidłowy hash lub rozmiar innoextract input.' }
            Invoke-DefenderGate -Target $archive -Stage 'innoextract-archive-before-expansion'
            $toolDir=Join-Path $prior 'innoextract'; Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force; $tool=Join-Path $toolDir 'innoextract.exe'; if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw 'Archiwum innoextract nie zawiera oczekiwanego pliku wykonawczego.' }
            Invoke-DefenderGate -Target $tool -Stage 'innoextract-before-execution'
            $extract=Join-Path $prior 'extracted'; & $tool --extract --silent --output-dir $extract $installer; if ($LASTEXITCODE -ne 0) { throw "innoextract zakończył się kodem $LASTEXITCODE" }
            $runtime=Join-Path $extract 'app\runtime'; $sitePackages=Join-Path $runtime 'Lib\site-packages'; $quickAddon=Join-Path $extract 'tmp\quickAppSwitcher-0.1.6.nvda-addon'
            if (-not (Test-Path -LiteralPath (Join-Path $runtime 'python.exe') -PathType Leaf) -or -not (Test-Path -LiteralPath $sitePackages -PathType Container) -or -not (Test-Path -LiteralPath $quickAddon -PathType Leaf)) { throw 'Rozpakowany instalator nie ma kanonicznej struktury runtime/site-packages/dodatku QAS.' }
            if ((Get-FileHash -LiteralPath $quickAddon -Algorithm SHA256).Hash.ToLowerInvariant() -cne '16dc660e6b3fece58af8ccb84ccc43824bcb7744e1f18a37ffa629685349a61f') { throw 'Quick App Switcher nie ma oczekiwanego hasha.' }
            Invoke-DefenderGate -Target $runtime -Stage 'extracted-runtime-before-use'
            $report.priorInstaller=[ordered]@{release='test-2026.11.15.2036'; name=(Split-Path -Leaf $installer); bytes=(Get-Item $installer).Length; sha256=$installerHash}; $report.innoextract=[ordered]@{release='670'; bytes=(Get-Item $archive).Length; sha256=$archiveHash}; $report.runtime=$runtime; $report.exitCode=0
            "AMC_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; "AMC_SITE_PACKAGES=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8; "AMC_QAS_ADDON=$quickAddon" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch { $report.error=$_.Exception.Message; throw } finally { $report.finishedUtc=[DateTime]::UtcNow.ToString('o'); $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8 }

      - name: Zainstaluj i zweryfikuj oficjalny kompilator Inno wyłącznie na VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          function Invoke-DefenderGate { param([string]$Target,[string]$Stage)
            $diagWarnings=@()
            $status=Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; $pref=Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal' -or [string]::IsNullOrWhiteSpace([string]$status.AMEngineVersion) -or [string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $null -eq $status.AntivirusSignatureLastUpdated -or ([DateTime]::UtcNow - [DateTime]$status.AntivirusSignatureLastUpdated.ToUniversalTime()).TotalDays -gt 7 -or $pref.DisableRealtimeMonitoring -or $pref.DisableBehaviorMonitoring -or $pref.DisableIOAVProtection -or @($pref.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw "Defender preflight failed: $Stage" }; if (@(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0 -or @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0) { throw "Defender threat state failed: $Stage" }; Start-MpScan -ScanType CustomScan -ScanPath $Target -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }; try { $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop) } catch { if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') {$events=@()} else {throw} }; if ($events.Count -gt 0) { throw "Defender events 1116/1117: $Stage" }
          }
          $stage='inno-provenance'; $reportPath=Join-Path $env:AMC_DIAGNOSTIC_EVIDENCE "$stage.json"; $report=[ordered]@{stage=$stage; startedUtc=[DateTime]::UtcNow.ToString('o'); finishedUtc=$null; exitCode=1; installer=$null; signature=$null; error=$null}
          try {
            $inno=Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'; Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $inno -ErrorAction Stop; $hash=(Get-FileHash -LiteralPath $inno -Algorithm SHA256).Hash.ToLowerInvariant(); if ($hash -cne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Niezgodny SHA-256 oficjalnego Inno Setup 6.7.3.' }
            Invoke-DefenderGate -Target $inno -Stage 'inno-installer-before-execution'; $signature=Get-AuthenticodeSignature -LiteralPath $inno; $report.signature=[ordered]@{status=[string]$signature.Status; subject=$signature.SignerCertificate.Subject; thumbprint=$signature.SignerCertificate.Thumbprint}; if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'JRSoftware|Jordan Russell') { throw 'Nieprawidłowy podpis lub nieoczekiwany signer oficjalnego Inno Setup.' }
            $installDir=Join-Path $env:RUNNER_TEMP 'InnoSetup-6.7.3'; $process=Start-Process -FilePath $inno -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru; if ($process.ExitCode -ne 0) { throw "Instalator narzędzia Inno zakończył się kodem $($process.ExitCode)" }; $iscc=Join-Path $installDir 'ISCC.exe'; if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Instalacja Inno nie dostarczyła ISCC.exe.' }; Invoke-DefenderGate -Target $installDir -Stage 'installed-inno-before-compiler-use'
            $report.installer=[ordered]@{url='https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'; version='6.7.3'; sha256=$hash}; $report.exitCode=0; "AMC_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch { $report.error=$_.Exception.Message; throw } finally { $report.finishedUtc=[DateTime]::UtcNow.ToString('o'); $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8 }

      - name: Zbuduj ze źródeł bieżący dodatek AMC NVDA po bramce AV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          $stage='amc-nvda-addon'; $reportPath=Join-Path $env:AMC_DIAGNOSTIC_EVIDENCE "$stage.json"; $report=[ordered]@{stage=$stage; startedUtc=[DateTime]::UtcNow.ToString('o'); finishedUtc=$null; exitCode=1; addon=$null; error=$null}
          function Invoke-DefenderGate { param([string]$Target,[string]$Stage)
            $diagWarnings=@()
            $status=Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; $pref=Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal' -or [string]::IsNullOrWhiteSpace([string]$status.AMEngineVersion) -or [string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $null -eq $status.AntivirusSignatureLastUpdated -or ([DateTime]::UtcNow - [DateTime]$status.AntivirusSignatureLastUpdated.ToUniversalTime()).TotalDays -gt 7 -or $pref.DisableRealtimeMonitoring -or $pref.DisableBehaviorMonitoring -or $pref.DisableIOAVProtection -or @($pref.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw "Defender preflight failed: $Stage" }; if (@(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0 -or @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0) { throw "Defender threat state failed: $Stage" }; Start-MpScan -ScanType CustomScan -ScanPath $Target -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }; try { $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop) } catch { if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') {$events=@()} else {throw} }; if ($events.Count -gt 0) { throw "Defender events 1116/1117: $Stage" }
          }
          try {
            Invoke-DefenderGate -Target $env:GITHUB_WORKSPACE -Stage 'source-before-amc-nvda-addon'
            & .\nvda-addon\build.ps1; $addons=@(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'AMC-NVDA-*.nvda-addon' -File); if ($addons.Count -ne 1) { throw 'Budowa nie utworzyła jednoznacznego dodatku AMC NVDA w katalogu głównym repozytorium.' }; $addon=$addons[0]; $finalAddon=Join-Path $env:RUNNER_TEMP $addon.Name; Move-Item -LiteralPath $addon.FullName -Destination $finalAddon; Invoke-DefenderGate -Target $finalAddon -Stage 'amc-nvda-addon-post-build'
            $report.addon=[ordered]@{name=(Split-Path -Leaf $finalAddon); bytes=(Get-Item $finalAddon).Length; sha256=(Get-FileHash -LiteralPath $finalAddon -Algorithm SHA256).Hash.ToLowerInvariant()}; $report.exitCode=0; "AMC_NVDA_ADDON=$finalAddon" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch { $report.error=$_.Exception.Message; throw } finally { $report.finishedUtc=[DateTime]::UtcNow.ToString('o'); $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8 }

      - name: Zbuduj kontrolowany bundle AMC Test po bramkach AV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          function Invoke-DefenderGate { param([string]$Target,[string]$Stage)
            $diagWarnings=@()
            $status=Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; $pref=Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal' -or [string]::IsNullOrWhiteSpace([string]$status.AMEngineVersion) -or [string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $null -eq $status.AntivirusSignatureLastUpdated -or ([DateTime]::UtcNow - [DateTime]$status.AntivirusSignatureLastUpdated.ToUniversalTime()).TotalDays -gt 7 -or $pref.DisableRealtimeMonitoring -or $pref.DisableBehaviorMonitoring -or $pref.DisableIOAVProtection -or @($pref.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw "Defender preflight failed: $Stage" }; if (@(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0 -or @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0) { throw "Defender threat state failed: $Stage" }; Start-MpScan -ScanType CustomScan -ScanPath $Target -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }; try { $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop) } catch { if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') {$events=@()} else {throw} }; if ($events.Count -gt 0) { throw "Defender events 1116/1117: $Stage" }
          }
          $stage='bundle'; $reportPath=Join-Path $env:AMC_DIAGNOSTIC_EVIDENCE "$stage.json"; $report=[ordered]@{stage=$stage; startedUtc=[DateTime]::UtcNow.ToString('o'); finishedUtc=$null; exitCode=1; bundle=$null; error=$null}
          try {
            Invoke-DefenderGate -Target $env:GITHUB_WORKSPACE -Stage 'source-before-bundle'; $hook={ param([string]$Path,[string]$Stage) Invoke-DefenderGate -Target $Path -Stage $Stage }
            $bundle=Join-Path $env:RUNNER_TEMP 'amc-test-bundle'; & .\wxlite\tools\Build-AMCBundle.ps1 -Profile test -PythonRuntime $env:AMC_RUNTIME -TidalSitePackages $env:AMC_SITE_PACKAGES -SonosSitePackages $env:AMC_SITE_PACKAGES -AppleMusicSitePackages $env:AMC_SITE_PACKAGES -OutputDirectory $bundle -BeforeCandidateExecution $hook; if ($LASTEXITCODE -ne 0) { throw "Build-AMCBundle zakończył się kodem $LASTEXITCODE" }
            Invoke-DefenderGate -Target $bundle -Stage 'bundle-post-build'; $report.bundle=$bundle; $report.exitCode=0; "AMC_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch { $report.error=$_.Exception.Message; throw } finally { $report.finishedUtc=[DateTime]::UtcNow.ToString('o'); $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8 }

      - name: Skompiluj jeden kontrolowany instalator diagnostyczny AMC Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          function Invoke-DefenderGate { param([string]$Target,[string]$Stage)
            $diagWarnings=@()
            $status=Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; $pref=Get-MpPreference -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $status.AMRunningMode -ne 'Normal' -or [string]::IsNullOrWhiteSpace([string]$status.AMEngineVersion) -or [string]::IsNullOrWhiteSpace([string]$status.AntivirusSignatureVersion) -or $null -eq $status.AntivirusSignatureLastUpdated -or ([DateTime]::UtcNow - [DateTime]$status.AntivirusSignatureLastUpdated.ToUniversalTime()).TotalDays -gt 7 -or $pref.DisableRealtimeMonitoring -or $pref.DisableBehaviorMonitoring -or $pref.DisableIOAVProtection -or @($pref.ExclusionPath | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionProcess | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0 -or @($pref.ExclusionExtension | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw "Defender preflight failed: $Stage" }; if (@(Get-MpThreat -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0 -or @(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings).Count -gt 0) { throw "Defender threat state failed: $Stage" }; Start-MpScan -ScanType CustomScan -ScanPath $Target -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings; if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }; try { $events=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop) } catch { if ($_.FullyQualifiedErrorId -eq 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') {$events=@()} else {throw} }; if ($events.Count -gt 0) { throw "Defender events 1116/1117: $Stage" }
          }
          $stage='installer'; $reportPath=Join-Path $env:AMC_DIAGNOSTIC_EVIDENCE "$stage.json"; $report=[ordered]@{stage=$stage; startedUtc=[DateTime]::UtcNow.ToString('o'); finishedUtc=$null; exitCode=1; output=$null; error=$null}
          try {
            Invoke-DefenderGate -Target $env:AMC_BUNDLE -Stage 'bundle-before-installer'; $hook={ param([string]$Path,[string]$Stage) Invoke-DefenderGate -Target $Path -Stage $Stage }; $output=Join-Path $env:RUNNER_TEMP 'amc-test-diagnostic-installer'
            & .\wxlite\tools\Build-AMCInstaller.ps1 -Profile test -BundleRoot $env:AMC_BUNDLE -Version '0.1.0-alpha.511' -OutputDirectory $output -NvdaAddonPath $env:AMC_QAS_ADDON -AmcNvdaAddonPath $env:AMC_NVDA_ADDON -IsccPath $env:AMC_ISCC -BeforeCandidateExecution $hook; if ($LASTEXITCODE -ne 0) { throw "Build-AMCInstaller zakończył się kodem $LASTEXITCODE" }
            Invoke-DefenderGate -Target $output -Stage 'installer-post-build'; $report.output=$output; $report.exitCode=0; "AMC_INSTALLER_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch { $report.error=$_.Exception.Message; throw } finally { $report.finishedUtc=[DateTime]::UtcNow.ToString('o'); $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding utf8 }

      - name: Odczytaj końcowe zdarzenia ochrony i zachowaj dowód kompilatora
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagWarnings=@()
          $evidence=Join-Path $env:RUNNER_TEMP 'amc-diagnostic-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $report=[ordered]@{stage='final-defender-audit'; capturedUtc=[DateTime]::UtcNow.ToString('o'); exitCode=1; status=$null; detections=@(); events1116_1117=@(); error=$null}
          try {
            $status=Get-MpComputerStatus -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings
            $report.status=[ordered]@{antivirusEnabled=$status.AntivirusEnabled; realTimeProtectionEnabled=$status.RealTimeProtectionEnabled; engine=$status.AMEngineVersion; signature=$status.AntivirusSignatureVersion}
            $report.detections=@(Get-MpThreatDetection -ErrorAction Stop -WarningAction Continue -WarningVariable +diagWarnings | Select-Object ThreatID,InitialDetectionTime,LastThreatStatusChangeTime,ActionSuccess,Resources)
            try { $report.events1116_1117=@(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117; StartTime=[DateTime]::Parse($env:AMC_DIAGNOSTIC_JOB_STARTED).ToUniversalTime()} -ErrorAction Stop | ForEach-Object { [ordered]@{timeUtc=$_.TimeCreated.ToUniversalTime().ToString('o'); id=$_.Id; message=$_.Message} }) } catch { if ($_.FullyQualifiedErrorId -ne 'NoMatchingEventsFound,Microsoft.PowerShell.Commands.GetWinEventCommand') { throw } }
            if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled -or $report.detections.Count -gt 0 -or $report.events1116_1117.Count -gt 0) { throw 'Końcowa kontrola ochrony nie została zaliczona; binaria nie zostaną wysłane.' }
            if ($diagWarnings.Count -gt 0) { throw ('Ostrzezenia Defendera: ' + ($diagWarnings -join '; ')) }
            $report.exitCode=0
          } catch { $report.error=$_.Exception.Message; throw } finally {
            $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'final-defender-audit.json') -Encoding utf8
            $compile=Join-Path $env:RUNNER_TEMP 'amc-test-diagnostic-installer\installer-compile-evidence.json'
            if (Test-Path -LiteralPath $compile -PathType Leaf) { Copy-Item -LiteralPath $compile -Destination (Join-Path $evidence 'installer-compile-evidence.json') }
          }

      - name: Zachowaj instalator i sidecar tylko po czystym pełnym przebiegu
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amc-test-diagnostic-installer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/amc-test-diagnostic-installer/*.exe
            ${{ runner.temp }}/amc-test-diagnostic-installer/*.integrity.json
          if-no-files-found: error
          retention-days: 30

      - name: Zachowaj wyłącznie małe raporty diagnostyczne
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amc-diagnostic-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/amc-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 30
