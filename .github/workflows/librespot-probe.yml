name: Librespot Windows probe

on:
  push:
    branches: [hermes/librespot-probe]
    paths:
      - .github/workflows/librespot-probe.yml
      - native/AmcSpotifyLibrespotHost/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned upstream v0.8.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: librespot-org/librespot
          ref: d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d
          persist-credentials: false
      - name: Show compiler and exact source
        shell: pwsh
        run: |
          git rev-parse HEAD
          rustup toolchain list
          rustc +stable --version
          cargo +stable --version
      - name: Build Windows receiver without any account
        shell: pwsh
        env:
          # Statyczny CRT - u Michała dynamiczne exe padało 0xC0000135
          # (brak VCRUNTIME140.dll). Jawny --target chroni proc-macro hosta.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo +stable build --locked --release --target x86_64-pc-windows-msvc --no-default-features --features native-tls,rodio-backend,with-libmdns
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove the CLI needs no VC++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/x86_64-pc-windows-msvc/release/librespot.exe'
          $dumpbin = Get-ChildItem -Path 'C:\Program Files*\Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { Write-Error 'nie znaleziono dumpbin.exe'; exit 1 }
          $imports = & $dumpbin /imports $exe | Out-String
          Set-Content -Path imports-librespot.txt -Value $imports -Encoding utf8
          foreach ($dll in @('VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt')) {
            if ($imports -match [regex]::Escape($dll)) {
              Write-Error "librespot.exe wciaz importuje $dll"
              exit 1
            }
          }
          Write-Host 'librespot.exe: brak importow VC++ runtime.'
      - name: Smoke test CLI and prepare provenance
        shell: pwsh
        run: |
          $exe='target/x86_64-pc-windows-msvc/release/librespot.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path out | Out-Null
          Copy-Item $exe out/librespot.exe
          Copy-Item LICENSE out/LICENSE-librespot.txt
          Copy-Item imports-librespot.txt out/imports-librespot.txt -ErrorAction SilentlyContinue
          $receipt=[ordered]@{
            upstream='https://github.com/librespot-org/librespot'
            commit=(git rev-parse HEAD)
            target='x86_64-pc-windows-msvc'
            crtStatic=$true
            sha256=(Get-FileHash out/librespot.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            version=(& $exe --version | Out-String).Trim()
          }
          $receipt | ConvertTo-Json | Set-Content -Encoding utf8 out/provenance.json
      - name: Upload executable and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: librespot-windows-probe
          path: out/
          if-no-files-found: error
          retention-days: 14

  amc-host:
    name: AMC Spotify Librespot host (Rust, Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch with the wrapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Show toolchain
        shell: pwsh
        run: |
          rustc +stable --version
          cargo +stable --version
      - name: Cache cargo registry and git checkouts
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/AmcSpotifyLibrespotHost/target
          key: amchost-${{ runner.os }}-${{ hashFiles('native/AmcSpotifyLibrespotHost/Cargo.toml', 'native/AmcSpotifyLibrespotHost/Cargo.lock') }}
      - name: Build release binary
        shell: pwsh
        working-directory: native/AmcSpotifyLibrespotHost
        env:
          # Statyczny CRT: exe ma działać u użytkownika BEZ instalowania VC++ Redist.
          # Zmierzone na maszynie Michała: dynamicznie linkowane exe padało
          # 0xC0000135 (brak VCRUNTIME140.dll/MSVCP140.dll w System32).
          # Jawny --target jest konieczny, żeby flaga nie dotknęła proc-macro hosta.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo +stable build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run protocol tests (no Spotify account, no network playback)
        shell: pwsh
        working-directory: native/AmcSpotifyLibrespotHost
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          # -- nocapture: chcemy widzieć realne wyniki, nie tylko podsumowanie.
          cargo +stable test --release --target x86_64-pc-windows-msvc -- --nocapture --test-threads=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove the exe needs no VC++ runtime (import table, not just a happy run)
        shell: pwsh
        working-directory: native/AmcSpotifyLibrespotHost
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/x86_64-pc-windows-msvc/release/amc_spotify_librespot_host.exe'
          # Runner MA runtime VC++, więc samo uruchomienie nic nie dowodzi.
          # Dowodem jest tablica importów.
          $dumpbin = Get-ChildItem -Path 'C:\Program Files*\Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { Write-Error 'nie znaleziono dumpbin.exe - nie umiem udowodnic importow'; exit 1 }
          Write-Host "dumpbin: $dumpbin"
          $imports = & $dumpbin /imports $exe | Out-String
          Set-Content -Path imports.txt -Value $imports -Encoding utf8
          $bad = @('VCRUNTIME140', 'MSVCP140', 'VCRUNTIME140_1', 'api-ms-win-crt')
          $found = @()
          foreach ($dll in $bad) {
            if ($imports -match [regex]::Escape($dll)) { $found += $dll }
          }
          $dlls = ([regex]::Matches($imports, '(?im)^\s{4}(\S+\.dll)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          Write-Host '--- importowane biblioteki ---'
          $dlls | ForEach-Object { Write-Host "  $_" }
          if ($found.Count -gt 0) {
            Write-Error "exe wymaga VC++ Redist: $($found -join ', ') - crt-static nie zadzialal"
            exit 1
          }
          Write-Host 'Potwierdzone: brak importow VCRUNTIME140/MSVCP140/api-ms-win-crt.'
      - name: Prove stdout is JSON lines only (live process, PowerShell driver)
        shell: pwsh
        working-directory: native/AmcSpotifyLibrespotHost
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/x86_64-pc-windows-msvc/release/amc_spotify_librespot_host.exe'
          if (-not (Test-Path $exe)) { Write-Error "brak pliku: $exe"; exit 1 }

          $commands = @(
            '{"command":"ping","requestId":1,"sessionId":"spotifyLibrespot"}'
            '{"command":"devices","requestId":2,"sessionId":"spotifyLibrespot"}'
            '{"command":"ping","requestId":3,"sessionId":"nieTaSesja"}'
            'to nie jest json'
            '{"command":"pause","requestId":4,"sessionId":"spotifyLibrespot"}'
            '{"command":"shutdown","requestId":5,"sessionId":"spotifyLibrespot"}'
          )
          $commands | & $exe 2> stderr.txt | Tee-Object -FilePath stdout.txt | Out-Null
          $code = $LASTEXITCODE
          Write-Host "kod wyjscia procesu: $code"
          Write-Host '--- stdout ---'
          Get-Content stdout.txt
          Write-Host '--- stderr (logi, nie protokol) ---'
          Get-Content stderr.txt -ErrorAction SilentlyContinue

          if ($code -ne 0) { Write-Error "proces zakonczyl sie kodem $code"; exit 1 }

          $lines = Get-Content stdout.txt | Where-Object { $_.Trim().Length -gt 0 }
          $parsed = @()
          foreach ($line in $lines) {
            try { $parsed += ($line | ConvertFrom-Json) }
            catch { Write-Error "linia stdout nie jest JSON-em: $line"; exit 1 }
          }
          if ($parsed.Count -lt 6) { Write-Error "za malo zdarzen: $($parsed.Count)"; exit 1 }

          if ($parsed[0].type -ne 'ready') { Write-Error "pierwsze zdarzenie musi byc ready"; exit 1 }
          if ($parsed[0].protocolVersion -ne 1) { Write-Error "protocolVersion musi byc 1"; exit 1 }
          if ($parsed[1].type -ne 'ack' -or $parsed[1].requestId -ne 1) { Write-Error "brak ack dla ping"; exit 1 }
          if ($parsed[2].type -notin @('devices','error')) { Write-Error "devices: nieoczekiwany typ $($parsed[2].type)"; exit 1 }
          if ($parsed[3].type -ne 'error' -or $parsed[3].code -ne 'badSessionId') { Write-Error "zla sesja miala byc odrzucona"; exit 1 }
          if ($parsed[4].type -ne 'error' -or $parsed[4].code -ne 'badJson') { Write-Error "zepsuty JSON mial byc odrzucony"; exit 1 }
          if ($parsed[5].type -ne 'error' -or $parsed[5].code -ne 'notInitialized') { Write-Error "pause przed initialize mial byc odrzucony"; exit 1 }
          Write-Host 'Kontrakt stdout potwierdzony na zywym procesie.'
      - name: Package binary with SHA256 receipt
        shell: pwsh
        working-directory: native/AmcSpotifyLibrespotHost
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/amc_spotify_librespot_host.exe'
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item $exe out/amc_spotify_librespot_host.exe
          Copy-Item stdout.txt out/protocol-stdout-sample.jsonl -ErrorAction SilentlyContinue
          Copy-Item imports.txt out/imports-amc-host.txt -ErrorAction SilentlyContinue
          if (Test-Path Cargo.lock) { Copy-Item Cargo.lock out/Cargo.lock }
          $hash = (Get-FileHash out/amc_spotify_librespot_host.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = [ordered]@{
            binary            = 'amc_spotify_librespot_host.exe'
            sha256            = $hash
            target            = 'x86_64-pc-windows-msvc'
            librespotRev      = 'd36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d'
            librespotVersion  = '0.8.0'
            features          = 'native-tls, rodio-backend (bez discovery/Spirc)'
            bitrate           = '320 kbps (jawnie)'
            crtStatic         = $true
            protocolVersion   = 1
            sessionId         = 'spotifyLibrespot'
            amcCommit         = (git rev-parse HEAD)
            runUrl            = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            rustc             = (& rustc +stable --version | Out-String).Trim()
            niezmierzone      = 'Odtwarzanie na koncie Spotify: NIE mierzone (brak konta i tokenu w CI). Przyjecie tokenu AMC przez Librespot: nie sprawdzone. Slyszalny dzwiek i realny poziom glosnosci na urzadzeniu: nie mierzone (runner bez karty dzwiekowej).'
          }
          $receipt | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 out/provenance-amc-host.json
          Write-Host "SHA256 = $hash"
          Get-Content out/provenance-amc-host.json
      - name: Upload AMC host binary and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amc-spotify-librespot-host-windows
          path: native/AmcSpotifyLibrespotHost/out/
          if-no-files-found: error
          retention-days: 14
