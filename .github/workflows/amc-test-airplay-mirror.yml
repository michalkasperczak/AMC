name: AMC Test — AirPlay i drugie wyjście

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amc-test-airplay-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pobierz dokładne źródła
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Użyj .NET SDK 8 zgodnego z projektem
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.423

      - name: Użyj Pythona 3.14 do instalacji zależności AirPlay
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Sprawdź źródła i narzędzia
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          dotnet --version
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'Brak Inno Setup 6 na runnerze' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      - name: Pobierz poprzedni zweryfikowany instalator jako źródło runtime i dodatku NVDA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = Join-Path $env:RUNNER_TEMP 'amc-prior'
          New-Item -ItemType Directory -Path $prior | Out-Null
          gh release download test-2026.11.02.1743 --repo michalkasperczak/AMC `
            --pattern AMC-Test-2026-11-02-1743.exe --dir $prior
          if ($LASTEXITCODE -ne 0) { throw 'Nie pobrano poprzedniego instalatora' }
          $installer = Join-Path $prior 'AMC-Test-2026-11-02-1743.exe'
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'b81a56c7e164561babb107fbc2a06244431fa4df09c2336e4323ffa7503df23b'
          if ($actual -cne $expected) { throw 'Nieprawidłowy SHA-256 poprzedniego instalatora' }
          gh release download 670 --repo UserUnknownFactor/innoextract_win `
            --pattern innoextract670.zip --dir $prior
          if ($LASTEXITCODE -ne 0) { throw 'Nie pobrano narzędzia innoextract' }
          $archive = Join-Path $prior 'innoextract670.zip'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '79b69b9b1fcd98f42ccd4b245efdf6a03bcfb674ba6af482f5a46891c9ed4d14'
          if ($actual -cne $expected) { throw 'Nieprawidłowy SHA-256 narzędzia innoextract' }
          $toolDir = Join-Path $prior 'tool'
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          $extract = Join-Path $prior 'extracted'
          & (Join-Path $toolDir 'innoextract.exe') --extract --silent --output-dir $extract $installer
          if ($LASTEXITCODE -ne 0) { throw 'Nie udało się rozpakować poprzedniego instalatora' }
          $runtime = Join-Path $extract 'app\runtime'
          $addon = Join-Path $extract 'tmp\quickAppSwitcher-0.1.6.nvda-addon'
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'python314._pth')) `
              -or -not (Test-Path -LiteralPath (Join-Path $runtime 'python.exe'))) {
            throw 'Brak runtime CPython 3.14 w instalatorze'
          }
          if (-not (Test-Path -LiteralPath $addon -PathType Leaf)) {
            throw 'Brak paczki Quick App Switcher w instalatorze'
          }
          $addonHash = (Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($addonHash -cne '16dc660e6b3fece58af8ccb84ccc43824bcb7744e1f18a37ffa629685349a61f') {
            throw 'Nieprawidłowy SHA-256 dodatku NVDA'
          }
          "AMC_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AMC_ADDON=$addon" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $runtime 'python.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Pythona nie działa' }

      - name: Dodaj zamknięty zestaw bibliotek AirPlay do runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --only-binary=:all: --upgrade `
            --target (Join-Path $env:AMC_RUNTIME 'Lib\site-packages') `
            -r .\wxlite\requirements-airplay-win64.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:AMC_RUNTIME 'python.exe') -c `
            'import importlib.metadata as m; import pyatv,srptools,wx; print(m.version("pyatv"),m.version("srptools"),wx.version())'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zbuduj i sprawdź samowystarczalną paczkę AMC Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\wxlite\tools\Build-AMCBundle.ps1 -Profile test `
            -PythonRuntime $env:AMC_RUNTIME -OutputDirectory (Join-Path $env:RUNNER_TEMP 'amc-test-bundle')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Skompiluj i sprawdź instalator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\wxlite\tools\Build-AMCInstaller.ps1 -Profile test `
            -BundleRoot (Join-Path $env:RUNNER_TEMP 'amc-test-bundle') `
            -Version '0.1.0-alpha.467' `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'amc-test-release') `
            -NvdaAddonPath $env:AMC_ADDON -IsccPath $env:ISCC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Opublikuj zweryfikowane wydanie wstępne AMC Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Publish-AMCRelease.ps1 -Profile test -Version '0.1.0-alpha.467' `
            -ArtifactsDirectory (Join-Path $env:RUNNER_TEMP 'amc-test-release') `
            -NotesPath '.\docs\zadania\REL-20261102-alpha467-notes.md' -Publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zachowaj potwierdzenia i instalator na 14 dni
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amc-test-airplay-mirror-release
          path: ${{ runner.temp }}/amc-test-release/
          if-no-files-found: ignore
          retention-days: 14
