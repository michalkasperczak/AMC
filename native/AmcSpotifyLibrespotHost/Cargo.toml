[workspace]

[package]
name = "amc_spotify_librespot_host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Proces pomocniczy AMC dla sesji 'Spotify - Librespot': komendy JSON po stdin, zdarzenia JSON po stdout."
license = "MIT"

[[bin]]
name = "amc_spotify_librespot_host"
path = "src/main.rs"

# Przypięty rewizją upstream v0.8.0 (d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d).
# TLS jawnie native-tls, backend audio jawnie rodio. Bez discovery/Spirc.
[dependencies.librespot-core]
git = "https://github.com/librespot-org/librespot"
rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d"
default-features = false
features = ["native-tls"]

[dependencies.librespot-playback]
git = "https://github.com/librespot-org/librespot"
rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d"
default-features = false
features = ["native-tls", "rodio-backend"]

[dependencies.librespot-metadata]
git = "https://github.com/librespot-org/librespot"
rev = "d36f9f1907e8cc9d68a93f8ebc6b627b1bf7267d"
default-features = false
features = ["native-tls"]

[dependencies]
cpal = "0.16"
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }

# Wymuszenie wersji, którą upstream librespot v0.8.0 ma w swoim Cargo.lock.
# Bez tego (my nie mamy jeszcze locka) resolver wybiera vergen 9.1.0, które
# ciągnie vergen-lib 9.x, podczas gdy vergen-gitcl 1.0.8 wymaga vergen-lib 0.1.x.
# Skutek to realny błąd kompilacji skryptu build librespot-core:
#   error[E0277]: the trait bound `vergen::feature::build::Build: vergen_lib::entries::Add`
#                 is not satisfied
# Pin w naszym grafie unifikuje wersję dla całego drzewa.
[build-dependencies]
vergen = "=9.0.6"
